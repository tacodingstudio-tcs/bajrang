services:
  # ── API server ────────────────────────────────────────────────────────────
  - type: web
    name: hotel-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Use Neon's DIRECT connection string, NOT the pooled/PgBouncer one.
      # This app sets the active tenant schema via Prisma's ?schema= param
      # per PrismaClient, relying on search_path staying stable per
      # connection — PgBouncer's transaction-mode pooling can hand different
      # logical clients the same backend connection with stale search_path,
      # causing "relation does not exist" errors. Confirmed via direct
      # testing against Neon before writing this file.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: WEB_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Free plan has no worker service — run workers inside the API process.
      - key: RUN_WORKERS_INLINE
        value: true
      # Neon ignores Prisma's ?schema= search_path; this makes tenant clients SET LOCAL it.
      - key: FORCE_SEARCH_PATH
        value: true
      - key: STORAGE_TYPE
        value: local
